name: Daily Treasury Analysis

on:
  schedule:
    # Run daily at 6:00 PM EST (after markets close)
    - cron: '0 23 * * *'  # 23:00 UTC = 6:00 PM EST
  workflow_dispatch:  # Allow manual triggering

jobs:
  treasury-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Treasury Analysis
      run: python treasury_analysis_daily.py
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    - name: Push HTML to boquin.github.io
      run: |
        git clone https://x-access-token:${{ secrets.BOQUIN_DEPLOY_TOKEN }}@github.com/DataVizHonduran/boquin.github.io.git _boquin
        mkdir -p _boquin/reports/treasury-dashboard
        cp treasury_analysis_plotly.html _boquin/reports/treasury-dashboard/index.html
        cd _boquin
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add reports/treasury-dashboard/
        git diff --staged --quiet || git commit -m "Update treasury dashboard - $(date +'%Y-%m-%d')"
        git pull --rebase
        git push
