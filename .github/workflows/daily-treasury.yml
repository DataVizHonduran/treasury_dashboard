name: Daily Treasury Analysis

on:
  schedule:
    # Run daily at 6:00 PM EST (after markets close)
    - cron: '0 23 * * *'  # 23:00 UTC = 6:00 PM EST
  workflow_dispatch:  # Allow manual triggering

jobs:
  treasury-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Treasury Analysis
      run: python treasury_analysis_daily.py
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add treasury_analysis_plotly.html
        git diff --staged --quiet || (git commit -m "Update Treasury yield analysis - $(date +'%Y-%m-%d')" && git pull --rebase && git push)
